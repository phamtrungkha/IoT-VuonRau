; VuonRau ESP32 — PlatformIO (see docs/Readme.txt)
; MODE + build_src_filter: only one of modes/production.cpp or modes/test_sensor.cpp is built.
; Board esp32cam = Ai-Thinker ESP32-CAM. env esp32dev = generic WROOM devkit.

[platformio]
default_envs = normal

[env:normal]
platform = espressif32
board = esp32cam
framework = arduino
board_build.partitions = default.csv
monitor_speed = 115200
upload_speed = 115200
lib_deps =
  knolleary/PubSubClient
  bblanchon/ArduinoJson@^7
build_flags =
  '-DMDNS_HOSTNAME="vuonrau-esp32"'
  '-DDEVICE_ID="water_controller"'
  -DRELAY_PIN=15
  -DSENSOR_PIN=14
  -DAUTO_OFF_MINUTES=0.5
  '-DWIFI_SSID="Cam Nhung"'
  '-DWIFI_PASSWORD="51291276"'
  '-DMQTT_HOST="192.168.1.92"'
  -DMQTT_PORT=1883
  -DMODE=0
build_src_filter = +<*> -<modes/test_sensor.cpp>
upload_protocol = esptool

[env:normal_ota]
extends = normal
upload_protocol = espota
; Same basename as MDNS_HOSTNAME in build_flags above (+ .local). Override with LAN IP if mDNS fails on your PC.
upload_port = vuonrau-esp32.local
upload_flags =
  --timeout=60

[env:test_sensor_ota]
platform = espressif32
board = esp32cam
framework = arduino
board_build.partitions = default.csv
monitor_speed = 115200
upload_speed = 115200
lib_deps =
  knolleary/PubSubClient
  bblanchon/ArduinoJson@^7
build_flags =
  '-DMDNS_HOSTNAME="vuonrau-esp32"'
  '-DDEVICE_ID="water_controller"'
  -DRELAY_PIN=15
  -DSENSOR_PIN=12
  -DAUTO_OFF_MINUTES=0.5
  '-DWIFI_SSID="Cam Nhung"'
  '-DWIFI_PASSWORD="51291276"'
  '-DMQTT_HOST="192.168.1.92"'
  -DMQTT_PORT=1883
  -DMODE=1
build_src_filter = +<*> -<modes/production.cpp>
upload_protocol = espota
upload_port = vuonrau-esp32.local
upload_flags =
  --timeout=60
  --host_ip=192.168.1.6

[env:esp32dev]
extends = normal
board = esp32dev
