; ESP32-CAM only — temporary tree (ADC2 unusable while WiFi RF is on).
; Canonical / long-term firmware: ../esp32/ (e.g. esp32dev).
; Soil ADC: WiFi off → sample → reconnect (see sensor_adc_wifi_suspend.cpp).

[platformio]
default_envs = normal

[env:normal]
platform = espressif32
board = esp32cam
framework = arduino
board_build.partitions = default.csv
monitor_speed = 115200
upload_speed = 115200
lib_deps =
  knolleary/PubSubClient
  bblanchon/ArduinoJson@^7
build_flags =
  '-DMDNS_HOSTNAME="vuonrau-esp32"'
  '-DDEVICE_ID="water_controller"'
  -DRELAY_PIN=15
  -DSENSOR_PIN=14
  -DAUTO_OFF_MINUTES=0.5
  '-DWIFI_SSID="REPLACE_ME"'
  '-DWIFI_PASSWORD="REPLACE_ME"'
  '-DMQTT_HOST="192.168.1.92"'
  -DMQTT_PORT=1883
build_src_filter = +<*>
upload_protocol = esptool

[env:normal_ota]
platform = espressif32
board = esp32cam
framework = arduino
board_build.partitions = default.csv
monitor_speed = 115200
upload_speed = 115200
lib_deps =
  knolleary/PubSubClient
  bblanchon/ArduinoJson@^7
build_flags =
  '-DMDNS_HOSTNAME="vuonrau-esp32"'
  '-DDEVICE_ID="water_controller"'
  -DRELAY_PIN=15
  -DSENSOR_PIN=14
  -DAUTO_OFF_MINUTES=0.5
  '-DWIFI_SSID="REPLACE_ME"'
  '-DWIFI_PASSWORD="REPLACE_ME"'
  '-DMQTT_HOST="192.168.1.92"'
  -DMQTT_PORT=1883
build_src_filter = +<*>
upload_protocol = espota
upload_port = vuonrau-esp32.local
upload_flags =
  --timeout=60
